name: Weekly OSM snapshot for review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data-pipeline/overpass.py --region delhi-ncr
      - uses: actions/upload-artifact@v4
        with:
          name: osm-snapshot-review-before-publishing
          path: public/data/delhi-ncr/help.geojson
          retention-days: 14
