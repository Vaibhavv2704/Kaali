services:
  - type: web
    name: kaali
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_MAPTILER_KEY
        sync: false
